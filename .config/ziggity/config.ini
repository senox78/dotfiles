# ziggity config
# !!! ziggity (0.22.0-dev) does not support the XDG config path.
# -> need to set `ZIGGITY_CONFIG` in shell

show_file_tree = true

#  ╔═╗ ╔═╗ ╦   ╔═╗ ╦═╗
#  ║   ║ ║ ║   ║ ║ ╠╦╝
#  ╚═╝ ╚═╝ ╩═╝ ╚═╝ ╩╚═
# Rose Pine Dawn for Kitty's ANSI palette.
# Ziggity accepts terminal palette indices (0-255), not RGB values. Indices 0-8
# therefore use the exact colors defined by rose-pine-dawn.conf; the few fills
# outside that palette use restrained xterm-256 approximations.
#
#   surface   #f2e9e1 -> 0       muted  #9893a5 -> 8
#   text      #575279 -> 7       love   #b4637a -> 1
#   pine      #286983 -> 2       gold   #ea9d34 -> 3
#   foam      #56949f -> 4       iris   #907aa9 -> 5
#   rose      #d7827e -> 6
#
#   highlight med #dfdad9 ~= 253  word add wash ~= 194
#   word del wash ~= 224

# --- Selection --------------------------------------------------------------
color.selected_bg = 253           # highlight med: focused selection (#dadada)
color.inactive_selected_bg = 0    # surface: quieter unfocused selection
color.selected_fg = 7             # text

# --- Chrome and typography --------------------------------------------------
color.active = 2                  # pine: active border and state
color.accent = 5                  # iris: primary accent
color.inactive_border = 8         # muted
color.muted = 8                   # muted auxiliary text
color.title = 7                   # text
color.header = 4                  # foam: diff file headers
color.hunk = 5                    # iris: diff hunk headers

# --- Diff and status --------------------------------------------------------
color.added = 2                   # pine
color.staged = 2                  # pine
color.removed = 1                 # love
color.unstaged = 1                # love
# Pale washes retain contrast with pine/love foregrounds on Dawn's light base.
color.word_add_bg = 194           # pale green (#d7ffd7)
color.word_del_bg = 224           # pale red (#ffd7d7)

# --- Warning ---------------------------------------------------------------
color.warning = 3                 # gold

# --- Labels and footer ------------------------------------------------------
color.hash = 3                    # gold
color.tag = 6                     # rose
color.footer = 8                  # muted descriptions
color.footer_key = 5              # iris keys
