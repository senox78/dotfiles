<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Chromium resolves CSS system-ui to the desktop font, currently Monaspace
    Radon Var. Radon has no Japanese glyphs, so pin its first CJK fallback
    instead of allowing a user font such as Yomogi to be selected.
  -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Monaspace Radon Var</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
</fontconfig>
