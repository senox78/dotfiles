[backdrop]
blur_intensity = 0.0
enabled = false
tint_intensity = 0.0

[bar.default]
center = [ "media", "spacer_2", "clock" ]
end = [ "temp", "tray", "bluetooth", "volume", "control-center", "wallpaper", "notifications" ]
font_family = "Moralerspace Radon HW"
margin_ends = 0
radius = 0
start = [ "workspaces", "taskbar" ]

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "rei"
    type = "google"

[control_center.calendar]
show_events_card = true
show_week_numbers = true

