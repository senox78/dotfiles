[osd]
enabled = false

    [osd.kinds]
    keyboard_layout = false

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/.local/share/noctalia/plugins/PN/"
    name = "pl"

[shell]
avatar_path = "/home/rei/Pictures/self/night.jpg"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 1000
font_family = "Monaspace Radon Var"

    [shell.launcher]
    compact = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true

[theme]
builtin = "Rosé Pine"
mode = "light"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/rei/Pictures/wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 900

    [wallpaper.default]
    path = "/home/rei/Pictures/wallpapers/ghost_game.jpeg"

    [wallpaper.last]
    path = "/home/rei/Pictures/wallpapers/ghost_game.jpeg"

    [wallpaper.monitors.DP-1]
    path = "/home/rei/Pictures/wallpapers/ghost_game.jpeg"

    [wallpaper.monitors.DP-3]
    path = "/home/rei/Pictures/wallpapers/ghost_game.jpeg"

[widget.clock]
format = "{:%b %d %a %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 340

[widget.spacer_2]
type = "spacer"

[widget.taskbar]
group_by_workspace = true
only_active_workspace = true
show_workspace_label = false

[widget.temp]
show_glyph = false
visualization = "none"

[widget.volume.actions]
scroll_down = "volume-up 2"
scroll_up = "volume-down 2"
