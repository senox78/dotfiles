# OSクリップボードと同期（可能なら）
# set-option -g set-clipboard on
# set -g set-clipboard on
set -g mode-keys vi

# sync clipboard
# set-option -g set-clipboard external

# ローカルでは wl-copy、SSH 越しでは OSC52 でクライアント端末へ送る
# (詳しくは ~/dotfiles/.config/tmux/clipboard.sh のコメント参照)
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel '$HOME/dotfiles/.config/tmux/clipboard.sh'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel '$HOME/dotfiles/.config/tmux/clipboard.sh'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# change pain size
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# if local.conf exist, load
if-shell "test -f ~/.tmux/local.conf" "source-file ~/.tmux/local.conf"

# OSC52を使ってクリップボードに送る（必要な場合）
# set-option -g terminal-overrides 'xterm*:clipboard:cc'

set -g default-terminal "tmux-256color"
# source-file を繰り返しても terminal-features の追記が重複しないよう既定値へ戻す
set -gu terminal-features
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -as terminal-features ',xterm*:extkeys'
set -g extended-keys always
set -s extended-keys-format csi-u
# Codex が Shift+Enter を改行として認識できる CSI-u sequence を明示的に送る
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# クライアント端末 (kitty / ghostty) への機能転送
# - clipboard: set-clipboard on と合わせ、SSH 先のコピーを OSC52 で端末へ届ける
# - kitty graphics: tmux 自身の terminal feature ではなく、画像を出すアプリが
#   tmux passthrough で転送する (kitten icat / chafa / yazi など)
set -g allow-passthrough on

# General settings
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane
set-option -g set-clipboard on
# set-option -ga terminal-overrides ',xterm-256color:clipboard:enable'

set -g @scroll-speed-num-lines-per-scroll 0.5

# Status bar
set -g status-justify left
set -g status-position top

# Rosé Pine is loaded before this file and adds Nerd Font glyphs to the bar.
# Keep its colors, but use tmux's built-in status text and tab design.
set -gu status-left
set -gu status-right
set -gu window-status-format
set -g window-status-current-format '*#I:#W*'
set -gu window-status-separator
set -gu window-status-style
set -gu window-status-current-style
set -gu window-status-activity-style
